name: Release packages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Build packages
        run: python scripts/build_packages.py
      - name: Run tests
        run: python -m pytest -q
      - name: Create release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/*.hapkg dist/index.json \
            --target "${{ github.sha }}" \
            --title "Packages $tag" \
            --notes "Automated build of all integration packages from commit ${{ github.sha }}."
